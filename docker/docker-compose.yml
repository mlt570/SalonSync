version: "3.8"

services:
  db:
    image: postgres:15
    container_name: nail_salon_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nails
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../data:/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: nail_salon_api
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: nails
      DB_USER: postgres
      DB_PASSWORD: postgres

volumes:
  db_data:
