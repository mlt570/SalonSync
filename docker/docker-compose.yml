version: "3.8"

services:
  db:
    image: postgres:15
    container_name: nail_salon_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nails
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../data:/data

volumes:
  db_data:
